[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evtx-triage"
version = "0.1.0"
description = "Offline Windows event log triage with small on-device models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["evtx>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evtx-triage = "evtx_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
